<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Aarav &amp; Anaya · Wedding Invitation</title>
<meta name="description" content="Together with their families, Aarav & Anaya invite you to celebrate their wedding on 18 January 2027 in Jaipur, Rajasthan." />
<meta name="theme-color" content="#FBF7F0" />
<meta property="og:title" content="Aarav & Anaya · Wedding Invitation" />
<meta property="og:description" content="18 January 2027 · Jaipur, Rajasthan. You're invited." />
<meta property="og:type" content="website" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="invite-page">

<main class="invite-card" id="inviteCard">
  <div class="invite-border" aria-hidden="true"></div>
  <div class="invite-flourish" aria-hidden="true"></div>

  <p class="invite-pre" data-field="invite_line">Together with their families</p>

  <h1 class="invite-names">
    <span data-field="couple_name_1">Aarav</span>
    <span class="invite-amp">&amp;</span>
    <span data-field="couple_name_2">Anaya</span>
  </h1>

  <p class="invite-request">request the pleasure of your company</p>

  <div class="invite-date">
    <span class="invite-date-day" data-field="wedding_day">Sunday</span>
    <span class="invite-date-main" data-field="wedding_date_label">18 January 2027</span>
    <span class="invite-date-city" data-field="city">Jaipur, Rajasthan</span>
  </div>

  <div class="invite-events" id="inviteEvents">
    <span>Mehendi</span><span class="sep">·</span>
    <span>Sangeet</span><span class="sep">·</span>
    <span>Wedding</span><span class="sep">·</span>
    <span>Reception</span>
  </div>

  <div class="invite-actions">
    <a href="index.html" class="btn btn-primary" data-cta="invite-open-site">Open Wedding Website</a>
    <a href="index.html#rsvp" class="btn btn-ghost" data-cta="invite-rsvp">RSVP</a>
  </div>

  <div class="invite-share">
    <button type="button" class="btn btn-whatsapp btn-full" id="inviteShare" data-cta="invite-whatsapp">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M20.5 3.5A11.9 11.9 0 0 0 12 0C5.4 0 0 5.4 0 12c0 2.1.6 4.2 1.6 6L0 24l6.2-1.6c1.8 1 3.8 1.5 5.8 1.5 6.6 0 12-5.4 12-12 0-3.2-1.2-6.2-3.5-8.4zM12 22c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.3-.4A9.9 9.9 0 0 1 2 12C2 6.5 6.5 2 12 2c2.7 0 5.2 1 7.1 2.9A10 10 0 0 1 22 12c0 5.5-4.5 10-10 10zm5.5-7.5c-.3-.2-1.8-.9-2-1s-.5-.2-.7.2-.8 1-.9 1.2-.3.2-.6.1a8.2 8.2 0 0 1-2.4-1.5 9 9 0 0 1-1.7-2c-.2-.3 0-.5.1-.7l.4-.5.3-.5v-.5c0-.2-.7-1.6-.9-2.2s-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4s-1 .9-1 2.3 1 2.7 1.2 2.9 2 3.1 5 4.3c.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.6-.1 1.8-.7 2-1.4s.3-1.3.2-1.4z"/></svg>
      Share on WhatsApp
    </button>
    <button type="button" class="btn btn-ghost btn-full" id="inviteDownload" data-cta="invite-download">
      Download as image
    </button>
  </div>

  <div class="invite-flourish" aria-hidden="true"></div>
</main>

<p class="invite-footer">WeddingLink <span>by InfraAgentAI</span></p>

<script src="data/wedding-data.js"></script>
<script>
(function(){
  'use strict';
  var W = window.WEDDING || {};

  function track(event, data){
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push(Object.assign({ event: event }, data || {}));
    if (typeof gtag === 'function') gtag('event', event, data);
  }

  /* Field injection */
  document.querySelectorAll('[data-field]').forEach(function(el){
    var key = el.dataset.field;
    if (W[key] != null) el.textContent = W[key];
  });

  /* Dynamic events */
  var eventsEl = document.getElementById('inviteEvents');
  if (eventsEl && Array.isArray(W.events) && W.events.length) {
    eventsEl.innerHTML = W.events.map(function(e){
      return '<span>' + e.name + '</span>';
    }).join('<span class="sep">·</span>');
  }

  /* WhatsApp share */
  var shareBtn = document.getElementById('inviteShare');
  if (shareBtn) {
    shareBtn.addEventListener('click', function(){
      var name1 = W.couple_name_1 || 'Us';
      var name2 = W.couple_name_2 || '';
      var url = (W.wedding_url || window.location.origin) + '/invite.html';
      var msg = "You're invited to " + name1 + (name2 ? ' & ' + name2 : '') + "'s wedding 💍\n\nOpen the invitation: " + url;
      window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
      track('whatsapp_click', { source: 'invite_card' });
    });
  }

  /* Download as image */
  function loadHtml2Canvas() {
    return new Promise(function(resolve, reject){
      if (window.html2canvas) return resolve(window.html2canvas);
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
      s.onload = function(){ resolve(window.html2canvas); };
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  var dlBtn = document.getElementById('inviteDownload');
  if (dlBtn) {
    dlBtn.addEventListener('click', function(){
      track('invite_download', {});
      var card = document.getElementById('inviteCard');
      if (!card) return;
      loadHtml2Canvas()
        .then(function(h2c){
          return h2c(card, {
            backgroundColor: '#FBF7F0',
            scale: 2,
            useCORS: true,
            logging: false
          });
        })
        .then(function(canvas){
          var a = document.createElement('a');
          var name1 = (W.couple_name_1 || 'wedding').toLowerCase();
          var name2 = (W.couple_name_2 || 'invite').toLowerCase();
          a.download = name1 + '-' + name2 + '-invitation.png';
          a.href = canvas.toDataURL('image/png');
          a.click();
        })
        .catch(function(){
          window.print();
        });
    });
  }

  /* CTA auto-track */
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-cta]');
    if (!el) return;
    track('cta_click', { cta: el.dataset.cta, page: 'invite' });
  });

  track('demo_view', { source: 'invite_card' });
})();
</script>
</body>
  </html>
