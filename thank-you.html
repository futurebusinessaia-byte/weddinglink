<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thank you · WeddingLink</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="invite-page">

<main class="invite-card" style="max-width:520px">
  <div class="invite-border" aria-hidden="true"></div>
  <div class="invite-flourish" aria-hidden="true"></div>

  <div class="success-icon" style="margin:0 auto 18px">
    <svg viewBox="0 0 24 24" width="28" height="28"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <p class="invite-pre">Payment received</p>
  <h1 style="font-family:var(--serif);font-size:clamp(32px,8vw,44px);font-weight:500;margin:18px 0;color:var(--ink)">Thank you</h1>
  <p style="color:var(--ink-soft);line-height:1.7;margin-bottom:26px">
    Your WeddingLink order is confirmed. We'll email you within 24 hours to collect your wedding details and begin setup.
  </p>

  <p style="font-size:12px;color:var(--ink-muted);letter-spacing:.14em;text-transform:uppercase;margin-bottom:26px">
    WeddingLink
  </p>

  <a href="/" class="btn btn-primary btn-full">View live demo</a>

  <div class="invite-flourish" aria-hidden="true"></div>
</main>

<script>
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'purchase', page: 'thank_you' });
  if (typeof gtag === 'function') {
    gtag('event', 'purchase', { transaction_id: 'wl_' + Date.now() });
  }
</script>

</body>
</html>
